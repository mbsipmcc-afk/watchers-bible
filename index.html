<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- iOS launch screens: night splash, no white flash on cold start -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash-1284x2778.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash-1125x2436.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f7f7f5" id="themeColorMeta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Watchers" />
    <meta
      name="description"
      content="Watchers Bible — a free, offline-first Bible. 25 translations, instant search, highlights and notes, all on your device."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Watchers Bible" />
    <meta property="og:title" content="Watchers Bible — free, offline, on your device" />
    <meta
      property="og:description"
      content="25 Bible translations in 12 languages. Instant full-text search, highlights and notes — private, free, and fully offline."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Watchers Bible — night-sky app icon with gold accents" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Watchers Bible — free, offline, on your device" />
    <meta
      name="twitter:description"
      content="25 Bible translations in 12 languages. Instant search, highlights and notes — private, free, fully offline."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <title>Watchers Bible</title>
    <script>
      // Pre-paint theme: apply the saved theme before the first pixel so a
      // dark or sepia user never sees a white flash, and the status bar
      // always matches.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("wb-settings") || "{}");
          var themes = { light: "#faf7f1", sepia: "#f3e9d2", dark: "#0d0d17" };
          var t = themes[s.theme] ? s.theme : "light";
          var bg = themes[t];
          document.documentElement.dataset.theme = t;
          document.documentElement.style.background = bg;
          var f = s.fontSize ? s.fontSize : 17;
          var lh = s.lineHeight ? s.lineHeight : 1.75;
          var ff =
            s.fontFamily === "sans"
              ? '"Inter Variable", system-ui, sans-serif'
              : '"Literata Variable", Georgia, serif';
          document.documentElement.style.setProperty("--reader-font-size", f + "px");
          document.documentElement.style.setProperty("--reader-line-height", String(lh));
          document.documentElement.style.setProperty("--reader-font-family", ff);
          var meta = document.getElementById("themeColorMeta");
          if (meta) meta.setAttribute("content", bg);
        } catch (e) {
          /* defaults apply */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
